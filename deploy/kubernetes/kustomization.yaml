# kubectl apply -k deploy/kubernetes
#
# Create the goredis-auth Secret first (see secret.example.yaml and
# docs/kubernetes.md). Not included on purpose:
#   secret.example.yaml  placeholder only; would overwrite the real Secret
#   servicemonitor.yaml  needs the prometheus-operator CRD
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: goredis

resources:
  - namespace.yaml
  - configmap.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: goredis
    includeSelectors: false

# Pin the image here instead of editing deployment.yaml, e.g.:
# images:
#   - name: ghcr.io/OWNER/goredis
#     newName: ghcr.io/your-org/goredis
#     newTag: v0.1.0
