# EXAMPLE ONLY. DO NOT COMMIT REAL VALUES TO GIT.
#
# This file is intentionally NOT listed in kustomization.yaml, so applying the
# kustomization never overwrites a real Secret with this placeholder.
# Create the real Secret out of band instead:
#
#   kubectl -n goredis create secret generic goredis-auth \
#     --from-literal=password="$(openssl rand -base64 32)"
#
# or use a secret manager (External Secrets, Sealed Secrets, SOPS).
apiVersion: v1
kind: Secret
metadata:
  name: goredis-auth
  namespace: goredis
  labels:
    app.kubernetes.io/name: goredis
type: Opaque
stringData:
  password: "REPLACE-ME-DO-NOT-COMMIT-A-REAL-PASSWORD"
