apiVersion: v1
kind: Service
metadata:
  name: goredis
  labels:
    app.kubernetes.io/name: goredis
  annotations:
    # For Prometheus setups that discover targets via service annotations
    # (the common "kubernetes-service-endpoints" scrape job). With
    # prometheus-operator, use servicemonitor.yaml instead.
    prometheus.io/scrape: "true"
    prometheus.io/port: "9379"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: goredis
  ports:
    - name: resp
      port: 6379
      targetPort: resp
      protocol: TCP
    - name: metrics
      port: 9379
      targetPort: admin
      protocol: TCP
