# Prometheus configuration for the local compose stack
# (deploy/docker/docker-compose.yml). In Kubernetes, use the Service
# annotations or deploy/kubernetes/servicemonitor.yaml instead, and load
# alerts.yml through your Prometheus rule configuration.
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: goredis
    metrics_path: /metrics
    static_configs:
      - targets:
          - goredis:9379

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
